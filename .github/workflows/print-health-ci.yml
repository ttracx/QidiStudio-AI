name: Print Health CI

on:
  push:
    paths:
      - "ai_pipeline/print_health/**"
      - "ai_pipeline/unified_server.py"
      - "ai_pipeline/tests/test_print_health.py"
      - "ai_pipeline/requirements-ci.txt"
      - ".github/workflows/print-health-ci.yml"
  pull_request:
    paths:
      - "ai_pipeline/print_health/**"
      - "ai_pipeline/unified_server.py"
      - "ai_pipeline/tests/test_print_health.py"
      - "ai_pipeline/requirements-ci.txt"
      - ".github/workflows/print-health-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  print-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_pipeline/requirements-ci.txt

      - name: Install lightweight dependencies
        run: python -m pip install --requirement ai_pipeline/requirements-ci.txt

      - name: Compile Print Health
        working-directory: ai_pipeline
        run: |
          python -m compileall -q print_health unified_server.py tests/test_print_health.py

      - name: Unit tests
        working-directory: ai_pipeline
        run: python -m unittest discover -s tests -p 'test_print_health.py' -v
